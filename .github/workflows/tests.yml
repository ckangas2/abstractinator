# Runs the offline test suite on every push and pull request.
# (Live searches against the real databases are skipped here; run them
#  locally with ABSTRACTINATOR_LIVE_TESTS=1, see tests/testthat/test-live-searches.R)
name: tests

on:
  push:
  pull_request:

jobs:
  # Program registry and trial snapshots: standard-library Python, no R, so
  # this answers in seconds. The validator fails the build on a bad registry row.
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Registry and tracker tests
        run: |
          python3 tracker/registry.py validate
          python3 -m unittest discover -s tracker/tests

  test:
    # Pinned rather than ubuntu-latest: the latest label migrates to Ubuntu 26
    # from 2026-10-19, which would change the toolchain without a commit here.
    runs-on: ubuntu-24.04
    # A normal run takes under 10 minutes even with a cold package cache; a
    # stuck runner fails here instead of hanging for an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # setup-r apt-installs system packages first. On 2026-11-11 the runners'
      # default mirror (azure.archive.ubuntu.com) stalled for 40+ minutes, so
      # use the main Ubuntu archive, and give up on a dead mirror quickly.
      - name: Use the main Ubuntu mirror
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::withr
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::jsonlite
            any::htmltools
            any::digest
            any::future
            any::promises
            any::arrow
            any::plotly
            any::ggplot2
            any::forcats
            any::ggbeeswarm
            any::tidyverse
            any::httr2
            any::uuid
            any::shiny
            any::shinythemes
            any::bslib
            any::shinyjs
            any::shinyWidgets
            any::htmlTable
            any::htmlwidgets
            any::DT
            any::parallelly
            any::DBI
            any::RSQLite
            any::stringi

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
