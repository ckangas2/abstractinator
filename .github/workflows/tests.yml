# Runs the offline test suite on every push and pull request.
# (Live searches against the real databases are skipped here; run them
#  locally with ABSTRACTINATOR_LIVE_TESTS=1, see tests/testthat/test-live-searches.R)
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::withr
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::jsonlite
            any::htmltools
            any::digest
            any::future
            any::promises
            any::arrow
            any::plotly
            any::ggplot2
            any::forcats
            any::ggbeeswarm

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
