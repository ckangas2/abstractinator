# Weekly check that the versions in renv.lock still install and still pass.
#
# Deliberately NOT part of the per-push workflow: a full restore installs all
# 155 locked packages -- including ones only the retired _targets.R and
# build_*.R scripts reference -- which would take the ~100s test run into the
# ten-minute range on every commit. Upstream drift is a slow problem, so it
# gets a slow check.
name: locked-deps

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, early
  workflow_dispatch:        # and on demand

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Restore into the default library rather than a project library: renv
      # here is a record of versions, not an activated project. There is no
      # .Rprofile in this repo on purpose -- see .gitignore.
      - name: Restore locked versions
        run: |
          install.packages("renv")
          renv::restore(lockfile = "renv.lock", library = .libPaths()[1], prompt = FALSE)
        shell: Rscript {0}

      - name: Run tests against locked versions
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
