# Weekly check that the versions in renv.lock still install and still pass.
#
# Deliberately NOT part of the per-push workflow: a full restore installs all
# 155 locked packages -- including ones only the retired _targets.R and
# build_*.R scripts reference -- which would take the ~100s test run into the
# ten-minute range on every commit. Upstream drift is a slow problem, so it
# gets a slow check.
name: locked-deps

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, early
  workflow_dispatch:        # and on demand

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same mirror fix as tests.yml: the runners' Azure mirror has stalled before.
      - name: Use the main Ubuntu mirror
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts

      # renv::restore installs R packages but not the C libraries they link
      # against. tests.yml gets these from setup-r-dependencies; here we list
      # them. systemfonts, textshaping and ragg (pulled in by tidyverse) need
      # fontconfig, freetype, harfbuzz, fribidi and the image libraries.
      - name: System libraries for the locked packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libsqlite3-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Restore into the default library rather than a project library: renv
      # here is a record of versions, not an activated project. There is no
      # .Rprofile in this repo on purpose -- see .gitignore.
      - name: Restore locked versions
        run: |
          install.packages("renv")
          # repos: Posit's binary mirror (set by setup-r) instead of the
          # lockfile's CRAN source URL, so locked versions install as
          # prebuilt binaries where they exist. Same versions either way.
          renv::restore(lockfile = "renv.lock", library = .libPaths()[1],
                        repos = getOption("repos"), prompt = FALSE)
        shell: Rscript {0}

      - name: Run tests against locked versions
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
