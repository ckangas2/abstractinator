<!--
  gotham-skyline.html -- the glowing "skyline" line that sits above the four
  feature cards on the home page (Deduplicatinator, Plotinator, Readinator,
  Agentinator), after the nav bar on the 1996 "Welcome to Gotham" site.

  Inserted by app/ui.R just before the feature-card row. Purely decorative:
  the cards themselves stay the existing actionLinks, so the server code is
  unchanged. The four notches sit over the four card columns (25% each).
  Hidden on phones, where the cards stack and the line would mean nothing.
-->
<div class="gotham-skyline" style="display:none" aria-hidden="true">
  <p class="gotham-skyline-title">The Lab</p>
  <svg viewBox="0 0 1000 60" preserveAspectRatio="none">
    <polyline points="0,46 100,46 100,20 150,20 150,46 350,46 350,14 400,14 400,46 600,46 600,20 650,20 650,46 850,46 850,16 900,16 900,46 1000,46"></polyline>
  </svg>
</div>
