<!--
  gotham-scene.html -- the skyline under the title on the home page.

  Inserted by app/ui.R straight after h2("The Abstractinator"). Styled and
  shown by www/gotham.css; hidden (display:none) when that file is not loaded,
  so removing the two gotham lines from ui.R switches it off cleanly.

  How it is built (one 1000 x 300 SVG, waterline at y = 150):
    - The moon carries the current mascot as a black silhouette
      (#gothamMoonMascot, kept in sync by www/gotham.js).
    - #gothamWorld holds the city, the lab gear and every season's decorations.
      It is drawn twice: once mirrored and faded as the reflection in the
      water, once normally. gotham.css fades the reflection and the scene's
      edges into the page with a mask, so it suits any background colour.
    - Things in the sky (bats, geese, a sleigh) are drawn once, outside
      #gothamWorld, so they do not reflect.
    - Each season's pieces carry class "g-season g-<season>"; gotham.css shows
      only the ones matching <html data-season="...">.
  Generated by gen_scene.py (the snow, lights and falling particles are
  computed from the roofline); hand edits are fine.
-->
